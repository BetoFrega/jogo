orgs:
  - { id: org-merenda, name: "Merenda Exemplo Ltda." }
  - { id: org-obras, name: "Obras Teste S.A." }
facts:
  - id: f-nomeacao
    subject: { first: "Marta", last: "Exemplo" }
    relation: nomeou
    object: { first: "Rui", last: "Exemplo" }
    number: "0493"
  - id: f-conjuge
    subject: { first: "Rui", last: "Exemplo" }
    relation: conjuge
    object: { first: "Ana", last: "Teste" }
  - id: f-irmaos
    subject: { first: "Beto", last: "Teste" }
    relation: irmao_de
    object: { first: "Ana", last: "Teste" }
  - id: f-socia
    subject: { first: "Ana", last: "Teste" }
    relation: socio_de
    object: { org: org-merenda }
  - id: f-pagamento
    subject: { first: "Rui", last: "Exemplo" }
    relation: autorizou_pagamento
    object: { org: org-merenda }
    number: "1250"
questions:
  - id: q1
    mail: carta-01
    blocks:
      - { ask: "Quem nomeou quem, e por qual portaria?", fact: f-nomeacao }
      - { ask: "Com quem o nomeado é casado?", fact: f-conjuge }
      - { ask: "Quem é parente da esposa do nomeado?", fact: f-irmaos }
    accept_mail: carta-02
    reject_mail: recusa
  - id: q2
    mail: carta-02
    blocks:
      - { ask: "Quem é sócia de qual empresa?", fact: f-socia }
      - { ask: "O que Rui Exemplo autorizou, a quem, e com qual número?", fact: f-pagamento, fields: [rel, obj, num] }
      - { ask: "Quem nomeou quem? Informe o número da portaria.", fact: f-nomeacao, fields: [who, obj, num] }
    accept_mail: carta-03
    reject_mail: recusa
